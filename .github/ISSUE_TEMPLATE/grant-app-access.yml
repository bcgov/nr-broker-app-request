name: Request GitHub App Access (broker-jwt-update)
description: Request repository access for the broker-jwt-update GitHub App in bcgov-c.
title: "[App Access]: <repository-name>"
labels: ["access-request", "github-app", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### GitHub App Repository Access Request
        Use this form to request adding your repository to the **`broker-jwt-update`** GitHub App installation in **`bcgov-c`**.
        
        > **Security Note:** This app requires **Read & Write** access to **Actions, Administration, Environments, and Secrets**. Requests must be submitted or approved by a designated Repository Admin / Product Owner.

  - type: input
    id: repo-name
    attributes:
      label: Target Repository Name(s), Including Organization
      description: Provide the exact repository name(s) in `organization/repository` format, one per line.
      placeholder: |
        bcgov-c/my-service-api
        bcgov-c/my-service-frontend
    validations:
      required: true

  - type: input
    id: team-ministry
    attributes:
      label: Team / Project / Branch Name
      description: Identify the product team or ministry branch that owns this repository.
      placeholder: e.g., Platform Services / Core Infrastructure
    validations:
      required: true

  - type: input
    id: repo-admin
    attributes:
      label: Repository Admin / Technical Lead Contact
      description: GitHub handle (`@username`) of a current Repository Admin who approves this change. If you are not a Repo Admin, tag one below to comment their approval.
      placeholder: "@github-username"
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business & Technical Justification
      description: Briefly explain why this repository needs automated JWT/credential updates via `broker-jwt-update`.
      placeholder: e.g., Onboarding new microservice to automated Vault/OIDC JWT rotation pipeline for dev/test/prod environments.
    validations:
      required: true

  - type: dropdown
    id: action-type
    attributes:
      label: Request Type
      options:
        - Grant access to new repository
        - Revoke / Remove access from repository
    validations:
      required: true
